name: tuition2025
description: "Chương trình quản lý học phí"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.4+5

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  # Riverpod for state management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  image_picker: ^1.1.2
  sqflite: ^2.3.0  # Hoặc phiên bản mới nhất
  path_provider: ^2.1.5 # Hoặc phiên bản mới nhất
  path: ^1.9.0
  collection: ^1.18.0
  intl: ^0.20.2 # Nếu cần
  month_year_picker:
  flutter_localizations: # <-- THÊM DÒNG NÀY
    sdk: flutter        # <-- THÊM DÒNG NÀY
  fl_chart: ^0.68.0 # Thư viện vẽ biểu đồ
  cupertino_icons: ^1.0.8
  pdf: ^3.10.8
  printing: ^5.12.0
  open_filex: ^4.4.0
  permission_handler: ^11.3.1
  file_picker: ^11.0.2
  share_plus: ^12.0.1
  csv: ^6.0.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  http: ^1.2.1
  package_info_plus: ^9.0.0
  home_widget: ^0.9.3
  local_auth: ^2.3.0
  url_launcher: ^6.3.0
  add_2_calendar: ^3.0.1
  firebase_core: ^3.10.1
  firebase_database: ^11.3.1
  sqflite_common_ffi_web: ^0.4.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Để thêm assets vào ứng dụng, thêm một mục assets như sau:
  assets:
    - assets/fonts/

  # Để thêm fonts chữ tùy chỉnh, thêm mục fonts như sau:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
